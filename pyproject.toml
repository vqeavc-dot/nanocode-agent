[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocode-agent"
version = "0.1.0"
description = "A lightweight coding agent with a hand-written loop and local ACI tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
nanocode = "nanocode.cli:main"
nanocode-ui = "nanocode.ui:main"

[tool.setuptools.packages.find]
include = ["nanocode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

